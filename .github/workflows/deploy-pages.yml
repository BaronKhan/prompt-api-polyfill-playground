name: Deploy to GitHub Pages

# Builds the playground on a GitHub-hosted runner and deploys the static output
# to GitHub Pages. On a personal account the published site is public (private
# Pages access control is a GitHub Enterprise Cloud feature only).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --ignore-engines: the polyfill pulls in cloud-backend SDKs (openai etc.)
      # with strict Node engine ranges, but we never use them at runtime, so an
      # engine mismatch should not block the install.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build
        run: yarn build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
